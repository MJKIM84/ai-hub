# Dependabot — 보안 취약점이 있는 의존성만 PR로 제안한다. 자동 머지는 하지 않는다(사람이 검토 후 머지).
#
# open-pull-requests-limit: 0 은 "버전 업(version updates) PR 을 열지 않는다"는 뜻이다. 이 항목이 있어야
# Dependabot 이 해당 생태계를 알고 있게 되어, 저장소 설정의 Dependabot security updates 가 취약점이 보고된
# 패키지·액션에 대해서만 PR 을 연다. (2026-09-27: 단순 메이저 버전 업 PR 6개가 한꺼번에 열려 닫았고,
# 보안 이득이 없는 갱신은 받지 않기로 함)
# - pip: rop-wiki/requirements.txt (== 로 고정된 버전)
# - github-actions: .github/workflows/*.yml (커밋 SHA로 고정된 액션)
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/rop-wiki"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "security"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "security"]
