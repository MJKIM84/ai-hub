name: rop-wiki pages

# 트리거
# - push(main, rop-wiki/**)·workflow_dispatch: 빌드 + GitHub Pages 배포
# - pull_request(rop-wiki/**, 이 워크플로): 빌드만(배포 없음). main 의 브랜치 보호 규칙이 요구하는 "build" 상태 검사를 PR 에 남긴다
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["rop-wiki/**"]
  pull_request:
    branches: [main]
    paths: ["rop-wiki/**", ".github/workflows/rop-wiki-pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포(main)는 group "pages" 로 직렬화하고, PR 빌드는 PR 별 그룹으로 분리해 배포를 막지 않는다
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

# 액션은 태그 대신 커밋 SHA로 고정한다(태그가 바뀌어도 실행 내용이 바뀌지 않게). 주석의 버전이 그 SHA가 가리키는 릴리스다.
# 갱신은 .github/dependabot.yml 의 github-actions 항목이 PR로 제안한다.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rop-wiki/requirements.txt

      - name: Install dependencies
        run: pip install -r rop-wiki/requirements.txt

      - name: Build (mkdocs build --strict)
        run: cd rop-wiki && mkdocs build --strict

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: rop-wiki/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
