name: rop-wiki pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["rop-wiki/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 액션은 태그 대신 커밋 SHA로 고정한다(태그가 바뀌어도 실행 내용이 바뀌지 않게). 주석의 버전이 그 SHA가 가리키는 릴리스다.
# 갱신은 .github/dependabot.yml 의 github-actions 항목이 PR로 제안한다.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rop-wiki/requirements.txt

      - name: Install dependencies
        run: pip install -r rop-wiki/requirements.txt

      - name: Build (mkdocs build --strict)
        run: cd rop-wiki && mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: rop-wiki/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
