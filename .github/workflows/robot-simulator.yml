name: robot simulator
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['robot-simulator/**', '.github/workflows/robot-simulator.yml']
  push:
    branches: [main]
    paths: ['robot-simulator/**', '.github/workflows/robot-simulator.yml']
permissions:
  contents: read
concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: robot-simulator/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Vercel session lifecycle and allocation limits
        working-directory: robot-simulator/vercel
        run: npm ci --no-audit --no-fund && npm test
      - name: Install runtime and test tools
        run: pip install -r robot-simulator/requirements.lock pytest==8.4.2 httpx==0.28.1
      - name: Visitor isolation and deployment tests (no live model calls)
        working-directory: robot-simulator
        run: python -m pytest tests -q
      - name: Build the deployment image
        run: docker build -t robot-simulator:test robot-simulator
      - name: Start isolated public mode behind a simulated HTTPS proxy
        run: >-
          docker run -d --name simulator --memory=3g --cpus=2
          -p 127.0.0.1:8000:8000
          -e ROBOT_PUBLIC_ORIGINS=https://demo.example
          -e FORWARDED_ALLOW_IPS='*'
          robot-simulator:test
      - name: Probe frontend, session, representative world, and physics
        run: python robot-simulator/deployment/smoke.py
      - name: Container logs on failure
        if: failure()
        run: docker logs simulator || true
      - name: Stop the test container
        if: always()
        run: docker rm -f simulator || true
