# 개념 재정립 작업 데이터 (1/3) — 렌즈, 카테고리, 영역
# build_scope.py 가 이 파일과 items_*.yaml, mapping.yaml 을 읽어 01~04 문서를 만든다.
# 고칠 때는 이 데이터를 고치고 스크립트를 다시 돌린다(문서를 손으로 고치지 않는다).

lenses:
  누가: [개발, 설계, 운영, 제조사, 소유자, 규제, 현장 사람]
  언제: [조사, 설계, 구현, 로봇·설비 연동, 설치·시운전, 운영, 유지·변경, 폐기·교체]
  무엇: [데이터 모델, 인터페이스·프로토콜, 알고리즘, UI·대화, 인프라, 검증·시험, 거버넌스·계약]
  어디: [물류창고, 제조 공장, 병원, 상업 시설, 가정, 실외, 기타]

role_labels:
  개발: 플랫폼 개발자
  설계: 통합·설계자
  운영: 운영자
  제조사: 로봇 제조사
  소유자: 현장 소유자
  규제: 규제·감사
  현장 사람: "현장의 사람(작업자·방문객·환자·거주자) — 렌즈에 추가한 값 [가정]"

# 필수 두 항목의 하위 항목. check 2 가 이 목록으로 검사한다.
mandatory:
  온톨로지:
    required: [등록, 능력 표현, 연동]
    extra: [검증·변경 관리]
  채팅:
    required: [맵 작성, 시나리오 구성, 로봇 구성, 시뮬레이션 재현]
    extra: [업무 지시, 기반]

# 출처 유형. 앞의 셋은 사용자가 말한 수집 대상(연구·기사·업체 발표)이고, check 6 이 이 셋 가운데 2종 이상을 요구한다.
source_types_core: [논문, 기사, 업체 발표]
source_types_other: [표준, 오픈소스 문서, 정부·연구기관, 업계 보고서]

categories:
  - id: A
    name: 기획·사업
    full_name: 기획·사업
    slug: planning-and-business
    must: false
    def: "플랫폼을 들이기 전과 들이는 동안 무엇을 왜 할지 정하는 일. 기술·시장 동향 조사, 사용 사례·요구·책임 범위, 경제성·조달·사업 모델."
    include: "결정의 대상이 ‘무엇을 맡기고, 무엇을 들이고, 얼마를 쓸지’인 항목. 구현 방법은 다른 카테고리에 둔다."
    question: "어떤 일을 로봇에게 맡기고, 무엇을 들여, 어떤 효과를 볼 것인가?"
    if_missing: "맡길 일의 범위와 투자 효과를 설명하지 못해 도입이 시작되지 않는다."
    why: "동향 조사·요구 정의·조달은 현장 소유자와 경영이 결정하고, 출처도 시장 보고서와 기사가 중심이라 구현 항목과 따로 묶었다."
    sources:
      - {type: 업계 보고서, ex: "IFR World Robotics 같은 연간 로봇 통계, 이동 로봇·서비스 로봇 시장 보고서"}
      - {type: 기사, ex: "로봇 산업 전문 매체의 투자·도입 기사"}
      - {type: 업체 발표, ex: "오케스트레이션·관제 제품 출시, 서비스형 로봇(RaaS) 요금제 발표"}
      - {type: 논문, ex: "로봇 도입의 경제성·총소유비용 분석"}
  - id: B
    name: 로봇 온톨로지
    full_name: "로봇 온톨로지 — 이기종 로봇 등록·능력 표현·시스템·로봇 연동"
    slug: robot-ontology
    must: true
    def: "서로 다른 제조사의 로봇을 등록하고, 무엇을 할 수 있는지 공통 모델로 표현하고, 그 모델로 시스템과 로봇이 쉽게 연동되게 하는 온톨로지 기능 전체."
    include: "로봇·능력·작업의 의미 모델과, 그 모델을 만들고(등록·추출·검토) 쓰고(질의·실행 연결·연동 자동화) 지키는(검증·변경 관리) 일. 통신 배관 자체(프로토콜·어댑터 구현)는 F에 둔다."
    question: "서로 다른 제조사의 로봇을 어떻게 등록하고, 할 수 있는 일을 같은 말로 표현해, 시스템과 쉽게 연결할 것인가?"
    if_missing: "새 로봇마다 연동을 손으로 다시 만들어야 하고, 어떤 로봇이 어떤 일을 할 수 있는지 플랫폼이 판단하지 못한다."
    why: "사용자 필수 항목이다. 옛 분류에서 한 영역(5)이던 것을 등록·능력 표현·연동·검증 네 영역으로 넓혀 카테고리로 올렸다."
    sources:
      - {type: 표준, ex: "IEEE 1872-2015(CORA), IEEE 1872.2-2021, VDA 5050 팩트시트, 자산 관리 셸(AAS)"}
      - {type: 논문, ex: "KnowRob, 능력·스킬·서비스 모델, 문서에서 온톨로지를 만드는 온톨로지 학습 연구"}
      - {type: 오픈소스 문서, ex: "ROS 2 로봇 기술 형식(URDF), Open-RMF 플릿 구성"}
      - {type: 업체 발표, ex: "제조사 SDK·API 문서 공개, 팩트시트 지원 발표"}
  - id: C
    name: 채팅 기반 구성·운영
    full_name: "채팅 기반 구성·운영 — 맵 작성·시나리오 구성·로봇 구성·실제 상황 시뮬레이션 재현·업무 지시"
    slug: chat-based-configuration-and-operation
    must: true
    def: "채팅으로 맵을 그리고, 시나리오를 구성하고, 로봇을 구성하고, 실제 상황을 시뮬레이션으로 재현하고, 업무를 지시·관리하는 대화형 기능 전체와 그 신뢰 기반."
    include: "사용자가 대화로 하는 일과, 대화 기능 자체의 확인·승인·오해석 방지·권한·모델 연결·평가. 대화가 부르는 엔진(지도 모델·시뮬레이터·배정 알고리즘)은 D·I·G 같은 해당 카테고리에 두고 연결한다."
    question: "맵 작성, 시나리오 구성, 로봇 구성, 실제 상황 재현, 업무 지시를 비전문 사용자가 대화만으로 할 수 있게 하려면?"
    if_missing: "현장 구성과 운영이 전문가용 편집 도구에 묶여, 설계 사용자와 운영 사용자가 플랫폼을 직접 쓰지 못한다."
    why: "사용자 필수 항목이다. 옛 트랙 이름(자연어 업무 지시 챗봇)은 업무 지시만 가리켰으므로, 맵·시나리오·로봇 구성·시뮬레이션 재현·업무 지시 다섯 기능을 영역 이름으로 드러냈다."
    sources:
      - {type: 논문, ex: "언어 모델 기반 로봇 계획(SayCan, Code as Policies), 언어로 3D 환경·시뮬레이션 과제를 만드는 연구(Holodeck, RoboGen 등)"}
      - {type: 업체 발표, ex: "로봇·관제 업체의 자연어 지시·생성형 AI 구성 기능 발표"}
      - {type: 기사, ex: "생성형 AI 로봇 인터페이스 도입 기사"}
      - {type: 오픈소스 문서, ex: "언어 모델 에이전트·도구 호출·구조화 출력 문서"}
  - id: D
    name: 공간·지도 모델
    full_name: 공간·지도 모델
    slug: space-and-map-model
    must: false
    def: "건물 도면·센서 지도·좌표계를 하나의 공간 모델로 만들고, 장소에 의미를 붙이고, 바뀔 때 관리하는 일."
    include: "공간의 형상·연결·좌표·층·이름에 관한 항목. 공간 안에 있는 것들의 현재 상태는 E에 둔다."
    question: "로봇마다 다른 지도와 건물 도면을 어떻게 하나의 공간으로 만들고 유지할 것인가?"
    if_missing: "로봇이 어디로 갈 수 있는지, 같은 장소를 무엇이라 부르는지 플랫폼이 몰라 배정·경로·대화가 모두 막힌다."
    why: "옛 B(공통 정보·환경 모델)에서 공간 항목만 모았다. 도면 인식 트랙의 연구 대상이 여기에 있다."
    sources:
      - {type: 표준, ex: "IFC(ISO 16739), OGC IndoorGML"}
      - {type: 논문, ex: "평면도 인식(래스터–벡터 변환), 다중 지도 정합, 위상 지도"}
      - {type: 오픈소스 문서, ex: "Open-RMF 건물 지도 편집기, Nav2 지도 서버"}
      - {type: 업체 발표, ex: "BIM 연동·지도 자동 생성 제품 발표"}
  - id: E
    name: 사물·사람·실시간 상태
    full_name: 사물·사람·실시간 상태
    slug: objects-people-and-live-state
    must: false
    def: "작업 대상과 자산의 식별·인계, 현장의 사람, 로봇·설비·공간의 현재 상태를 믿을 수 있게 관리하는 일."
    include: "움직이거나 바뀌는 것들과 그 현재 상태에 관한 항목. 로봇 능력 같은 정적 의미는 B, 공간 형상은 D에 둔다."
    question: "작업 대상·사람·설비·로봇이 지금 어디에 어떤 상태로 있는지 어떻게 믿을 수 있게 알 것인가?"
    if_missing: "물건이 실제로 넘겨졌는지, 사람이 있는지 모른 채 명령하게 되어 작업 완료와 안전을 보장하지 못한다."
    why: "옛 B의 7·8번에 시뮬레이터가 다루는 사람(보행자) 모델을 더했다. 공간(D)은 설계 때 주로 만들고 이 카테고리는 운영 중 계속 바뀌어 따로 묶었다."
    sources:
      - {type: 표준, ex: "GS1 EPCIS"}
      - {type: 논문, ex: "사회적 내비게이션·보행자 흐름 모델, 여러 출처의 상태 추정과 데이터 일관성"}
      - {type: 업체 발표, ex: "실내 위치 추적(RTLS)·자산 추적 제품 발표"}
      - {type: 기사, ex: "사람이 많은 공간의 로봇 운영 기사"}
  - id: F
    name: 연동
    full_name: "연동 — 로봇·설비·업무 시스템"
    slug: integration
    must: false
    def: "제조사 관제·로봇, 문·승강기 같은 설비, 업무 시스템과 실제로 연결하고 표준으로 호환성을 확보하는 일."
    include: "메시지·API·프로토콜·어댑터로 외부와 주고받는 항목. 온톨로지로 연동을 자동화하는 일은 B에 둔다."
    question: "제조사 관제·로봇·문·승강기·업무 시스템과 어떻게 확실하게 연결할 것인가?"
    if_missing: "로봇에 명령을 보내지도, 층을 옮기지도, 업무 요청을 받지도 못해 플랫폼이 실제로 아무것도 움직이지 못한다."
    why: "옛 C(연결·실행 기반)의 9·10번, 옛 A의 1번, 옛 G의 28번 표준 부분을 모았다. 로봇·설비·업무 시스템 연결은 같은 연동 기술 묶음이다."
    sources:
      - {type: 표준, ex: "VDA 5050, MassRobotics 상호운용 표준, OPC UA 로보틱스 규격, ISA-95"}
      - {type: 오픈소스 문서, ex: "Open-RMF 플릿 어댑터·설비 어댑터, ROS 2"}
      - {type: 업체 발표, ex: "제조사 관제 API 공개, 승강기·출입통제 업체의 로봇 연동 발표"}
      - {type: 기사, ex: "여러 제조사 로봇 연동 사례 기사"}
  - id: G
    name: 계획·최적화
    full_name: 계획·최적화
    slug: planning-and-optimization
    must: false
    def: "작업을 모델링·분해하고, 로봇에 배정하고, 순서·경로·공용 자원·충전을 최적화하는 결정 알고리즘."
    include: "실행 전에 ‘누가·언제·어디로·무엇을 써서’를 정하는 항목."
    question: "누가, 언제, 어디로, 어떤 자원을 써서 일할 것인가?"
    if_missing: "로봇이 늘수록 충돌·대기·충전 몰림이 생겨 처리량이 오히려 줄어든다."
    why: "옛 D를 그대로 이어받고, 작업 모델링(옛 2번)을 계획의 입력으로 옮겨 왔다."
    sources:
      - {type: 논문, ex: "MRTA 분류 체계, MAPF·Lifelong MAPF, MAPD"}
      - {type: 오픈소스 문서, ex: "Open-RMF 작업 배정·교통 관리"}
      - {type: 업체 발표, ex: "대규모 로봇 교통 관리 기술 발표"}
      - {type: 기사, ex: "MAPF 공개 대회·벤치마크 결과 기사"}
  - id: H
    name: 실행·협업·예외 복구
    full_name: 실행·협업·예외 복구
    slug: execution-collaboration-and-recovery
    must: false
    def: "명령을 확실하게 실행하고, 로봇 사이·사람과 로봇 사이의 협업과 인계를 확인하며, 예외가 생기면 복구하는 일."
    include: "실행 중에 일어나는 조정·확인·복구 항목."
    question: "계획한 일을 여러 로봇과 사람이 함께 끝까지 해내고, 어긋나면 어떻게 이어 갈 것인가?"
    if_missing: "명령이 중복되거나 사라지고, 인계가 확인되지 않으며, 고장 한 번에 업무가 멈춘다."
    why: "옛 C의 12번과 옛 E의 17·18·20번을 ‘실행 중’이라는 공통 시점으로 묶었다."
    sources:
      - {type: 논문, ex: "다중 로봇 협업·물체 인계, 행동 트리 기반 실행, 고장 복구"}
      - {type: 정부·연구기관, ex: "NIST 협업 로봇 시스템 성능 평가"}
      - {type: 오픈소스 문서, ex: "BehaviorTree.CPP, Nav2 복구 동작"}
      - {type: 업체 발표, ex: "모바일 매니퓰레이터·다중 로봇 협업 사례 발표"}
  - id: I
    name: 설계·시뮬레이션
    full_name: 설계·시뮬레이션
    slug: design-and-simulation
    must: false
    def: "시나리오를 모델링하고, 시뮬레이션으로 처리능력·배치·정책을 미리 보고, 가상 시운전과 실제 상황 재현을 하는 설계 사용자의 일."
    include: "가상 환경에서 설계·예측·재현하는 항목. 이 일을 대화로 하는 인터페이스는 C에 둔다."
    question: "현장을 바꾸거나 로봇을 늘리기 전에 가상으로 설계하고 결과를 미리 볼 수 있는가?"
