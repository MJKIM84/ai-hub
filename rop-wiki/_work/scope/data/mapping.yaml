assumptions:
  - "누가 렌즈에 ‘현장의 사람(작업자·방문객·환자·거주자)’ 값을 더했다. 병원·가정·상업 시설에서는 운영자가 아닌 사람이 로봇과 가장 많이 마주친다."
  - "무엇 렌즈는 기술의 종류라, 동향 조사·조달·교육·현장 적용 같은 항목은 무엇 칸을 비워 두었다(렌즈 값마다 항목이 있는지만 검사한다)."
  - "채팅으로 실제 상황 시뮬레이션 재현 가운데 ‘실제 운영 기록에서 재현’은 시뮬레이터에 아직 없다. 시뮬레이터는 자기 실행 기록 재생과 장애 주입까지 한다. 그래서 L023의 해당 부분과 L157을 신규로 두었다."
  - "L013 온톨로지 기반 연동 자동화는 사용자 문구 ‘쉽게 시스템과 로봇을 연동’을 구체화한 해석이다."
  - "카테고리 표시 순서는 기획 다음에 필수 두 카테고리(B·C)를 두었다. 순서는 표시용이며 축이 아니다."
  - "새 영역 ID를 ‘카테고리 문자+번호’(예: B2)로 두었다. 수정 단계에서 area_no(정수)를 문자열 ID로 바꾼다."
  - "출처 유형에 ‘업체 발표’를 ‘벤더 문서’와 따로 두는 것을 제안한다(보도자료·발표 대 매뉴얼·사양). 수정 단계에서 스키마 열거값에 더한다."
  - "옛 대분류 페이지 7개가 이어질 새 카테고리(리다이렉트 대상)를 핵심 질문이 가장 가까운 곳으로 골랐다(03 매핑 1절)."
  - "원문 11장의 물류 흐름 7단계와 흐름 매트릭스 내용은 지우지 않고 Q1(물류창고) 사례로 옮긴다."
  - "시뮬레이터 코드(PR #12)를 근거로 인용했다. 시뮬레이터는 연구 모델이며 실물 로봇 검증이 아니라고 스스로 밝힌다."
  - "카테고리별 출처 예시의 표준·논문·제품 이름은 수집 대상 후보다. 수집 단계에서 원문을 열어 확인한 뒤에만 페이지에 싣는다."
