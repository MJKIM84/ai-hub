# ROP 연구 위키 — GitHub Pages 배포 워크플로 "템플릿"
#
# 이 파일은 rop-wiki/deploy/ 안에 있어서 GitHub 가 실행하지 않는다. 켜려면 저장소 루트의 .github/workflows/ 로 복사한다:
#   mkdir -p .github/workflows && cp rop-wiki/deploy/github-pages.yml .github/workflows/rop-wiki-pages.yml
# 그리고 (1) 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 두고
#        (2) rop-wiki/config/ops.yaml 에서 deploy.enabled: true, deploy.method: actions 로 바꿔 커밋·푸시한다.
# ops.yaml 의 두 값이 그렇지 않으면 빌드만 하고 배포 단계는 건너뛴다(스위치는 ops.yaml 한 곳).
# 끄기: ops.yaml 의 deploy.enabled 를 false 로 되돌리거나 .github/workflows/rop-wiki-pages.yml 을 지운다. 자세한 절차는 rop-wiki/deploy/README.md.
#
# 트리거: 기본은 수동 실행(workflow_dispatch, Actions 탭 → "rop-wiki pages" → Run workflow)뿐이다.
#   매일 실행 결과를 자동으로 배포하려면 아래 push 절의 주석을 풀고 branches 를 서버가 푸시하는 브랜치로 바꾼다
#   (서버의 config/settings.yaml git_push: true 가 필요하다).
name: rop-wiki pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]              # 일일 파이프라인이 커밋·푸시하는 브랜치
  #   paths: ["rop-wiki/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rop-wiki-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rop-wiki
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rop-wiki/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read deploy switch (config/ops.yaml)
        id: gate
        run: |
          enabled="$(python3 pipeline/lib/notify.py --get deploy.enabled --default false)"
          method="$(python3 pipeline/lib/notify.py --get deploy.method --default gh-deploy)"
          if [ "$enabled" = "true" ] && [ "$method" = "actions" ]; then deploy=true; else deploy=false; fi
          echo "deploy.enabled=$enabled deploy.method=$method -> deploy=$deploy"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Build (mkdocs build --strict)
        run: mkdocs build --strict

      - name: Configure Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: rop-wiki/site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
