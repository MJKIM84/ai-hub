# 이 파일은 pipeline/lib/nav.py 의 write_mkdocs_yml() 이 생성한다. 손으로 고치지 말 것.
# 내비게이션 순서는 사양서 4.8 로 고정: 홈 → 소개 → 대분류 A~G → 중점 연구 트랙 → 주제 → 용어집 →
# 참고문헌 → 표준·프레임워크 → 열린 질문 → 흐름 매트릭스 → 변경 이력 → 운영 지표 → 로그.
# 4.7 의 횡단 페이지 "정정 요청 안내"는 4.8 순서 목록에 없으므로 그 순서를 끊지 않도록 맨 뒤(로그 다음)에 둔다. [가정]
site_name: ROP 연구 위키
site_description: SCM 관점의 로봇 오케스트레이션 플랫폼 연구
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ko
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - footnotes
  - admonition
  - sane_lists          # 참고문헌 페이지의 원문 12장 항목("5. …")이 원문 번호 그대로(start=5) 렌더링되게 한다
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - 홈: index.md
  - 소개:
    - SCM 관점의 ROP란 무엇인가: about/what-is-rop.md
    - ROP가 직접 소유할 범위와 외부 연계 경계: about/scope-boundary.md
    - SCM 관점의 연구 시작 방법: about/research-method.md
    - 논의한 아이디어의 연구영역 매핑: about/idea-mapping.md
    - 에이전트 소개: about/agents.md
    - 읽기 가이드: about/reading-guide.md
    - 기여·정정 방법: about/how-to-contribute.md
