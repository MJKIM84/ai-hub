# 원문 미러 목록 — 공식 문서의 원문(또는 공식 산출물)이 GitHub 에 있는 출처
#
# 쓰는 곳: pipeline/lib/sources.py mirror_for(url), pipeline/checks/check_urls.py(정본 URL 이 정책 차단일 때 미러 확인),
#          에이전트 프롬프트(원문 열람 경로 안내). 파이썬 표준 라이브러리 + pyyaml 로 읽는다.
#
# 항목 필드
#   name      사람이 읽는 이름
#   match     정본 페이지 URL 접두어 또는 호스트(문자열 하나 또는 목록). 비교할 때 scheme·www.·끝 슬래시·#조각은 무시한다.
#             여러 항목이 맞으면 더 긴(구체적인) match 의 raw_urls 가 앞에 온다.
#   raw_urls  raw.githubusercontent.com 경로. 첫 번째가 대표 원문이다.
#   repo      GitHub 저장소(owner/name), ref 는 브랜치·태그
#   relation  original          = 정본 페이지와 같은 문서의 원본(같은 글을 만드는 소스). 열면 '원문 열람'으로 인정한다
#             official_artifact = 같은 기관이 낸 공식 산출물(스키마·온톨로지·노드셋·다른 판). 정본 페이지 본문은 아니다
#             related           = 제3자 구현이거나 인용 문서가 설명하는 대상(논문의 온톨로지 파일 등)
#   note      주의 사항
#
# 규칙: 여기에 넣는 raw URL 은 넣기 전에 실제로 받아서 200 과 내용(300바이트 이상)을 확인한다(verified_at).
#       차단 여부는 이 파일에 적지 않는다. 열리는지는 실행할 때 check_urls.py 가 확인한다(네트워크 정책은 바뀔 수 있다).
#       github.com/<owner>/<repo>/blob/<ref>/<path> 형식의 URL 은 이 파일에 없어도 mirror_for 가 raw 경로로 바꿔 준다.

version: 1
verified_at: '2026-09-25'
