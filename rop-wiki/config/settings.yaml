# config/settings.yaml — ROP 연구 위키 파이프라인의 전역 설정
#
# 앞부분(wiki_name ~ web_tools_required)은 빌드 사양서 0장 "설정 (실행 전 확인)"의 YAML 을 값과 주석 그대로 옮긴 것이다.
# 뒷부분(repo_root 이후)은 실행 스크립트(pipeline/run_daily.*, pipeline/select_target.*, pipeline/agent_runner.py,
# pipeline/publish.*)가 읽는 항목이며 구축자가 추가했다. 항목마다 뜻과 읽는 주체는 config/README.md 에 있다.
# 상대 경로는 모두 위키 루트(이 파일의 상위 폴더, rop-wiki/) 기준이다. 날짜·시각은 timezone 의 지역 시각으로 해석한다.

# ---------------------------------------------------------------------------------------------
# 1. 빌드 사양서 0장 (값·주석 그대로)
# ---------------------------------------------------------------------------------------------
wiki_name: "ROP 연구 위키"                 # 표시 이름. 부제: SCM 관점의 로봇 오케스트레이션 플랫폼 연구
repo_path: "./rop-wiki"                    # 저장소 경로
storage: "markdown+git"                    # 기본값. Notion·Obsidian 등으로 바꿔도 4~7장의 구조와 규칙은 그대로 유지하고 저장 방식만 바꾼다
site_generator: "mkdocs-material"          # 정적 사이트. 다른 도구를 쓰더라도 4.8의 내비게이션 순서를 그대로 재현한다
agent_runtime: "claude-code-headless"      # 에이전트 실행 방식: claude -p 헤드리스 실행 또는 Agent SDK
scheduler: "cron"                          # cron / n8n / GitHub Actions 중 택1
run_time: "06:00 Asia/Seoul"               # 매일 1회
language: "ko"                             # 본문 한국어, 전문용어는 첫 등장 시 영문 병기
checkpoints: true                          # true면 9장의 멈춤 지점 2곳에서 사용자 확인을 받는다
tracks: ["manual-capability-ontology", "nl-task-chatbot", "floorplan-recognition"]     # 활성 중점 연구 트랙(8장, 운영 전환 2부에서 2개 추가). 정의는 config/tracks/<slug>.yaml
track_runs_per_week: 3                     # 주 7회 실행 중 트랙에 배정하는 횟수(트랙 조사 비중). 7이면 트랙 단계가 끝날 때까지 트랙만 실행. 운영 전환 2-4: 트랙이 3개가 되어 2 → 3 (DECISIONS)
track_weights:                             # 트랙 실행일에 어느 트랙을 고를지의 가중치(select_target.pick_track: 게시된 트랙 실행 수/가중치가 작은 트랙). 기본 1
  manual-capability-ontology: 1
  nl-task-chatbot: 1
  floorplan-recognition: 1
daily_budget:
  new_topic_pages: 1                       # 하루 신규 주제 페이지 상한
  page_updates: 2                          # 하루 기존 페이지 갱신 상한
  max_sources_per_run: 15                  # 회당 신규 출처 상한
  max_search_queries: 30                   # 회당 검색 횟수 상한
  max_retries: 2                           # 검증 반려 시 재작업 횟수
  track_max_sources_per_run: 20            # 트랙 실행은 출처·검색 상한을 별도로 둔다
  track_max_search_queries: 40
notify: "none"                             # none / slack_webhook / email
web_tools_required: true                   # 웹 검색·페이지 열람 도구가 없으면 실행을 중단하고 로그에 남긴다

# ---------------------------------------------------------------------------------------------
# 2. 실행 스크립트용 항목 (구축자 추가)
#
# 위 web_tools_required(사양서 0장 주석 "웹 검색·페이지 열람 도구가 없으면 실행을 중단")는 원문대로 적용한다: 준비 단계의 점검에서
# 웹 검색(WebSearch) 또는 페이지 열람(WebFetch) 도구를 쓸 수 없으면 즉시 중단하고 로그에 남긴다(7.3).
# 예외(사용자 override): 페이지 열람만 막힌 제한 환경에서는 사용자가 명시적으로 허용할 때만 진행한다 —
#   bash pipeline/run_daily.sh --allow-no-fetch   또는   ROP_ALLOW_NO_FETCH=1 bash pipeline/run_daily.sh   (매 실행 지정)
#   또는 아래 web_fetch_required: false (설정으로 계속 허용).
# override 로 진행하면 에이전트 실행 컨텍스트에 web_fetch_available: false 를 주고(모든 출처 "원문 미열람", 신뢰도 high 금지),
# runs/<id>/log.md 와 일일 로그에 "페이지 열람 불가 — 원문 미열람 모드(사용자 override)"를 남긴다. 웹 검색 도구가 없으면 override 와 관계없이 중단한다.
# ---------------------------------------------------------------------------------------------
repo_root: ".."                            # git 저장소 루트. 위키 루트 기준 상대 경로. 위키가 ai-hub 저장소의 하위 폴더 rop-wiki/ 라는 전제 [가정]. git_commit·git_push 는 이 경로에서 실행하고, 위의 repo_path("./rop-wiki")는 그 저장소 루트에서 본 위키 폴더다
claude_bin: "claude"                       # 헤드리스 실행에 쓰는 Claude Code CLI 실행 파일. PATH 에 있으면 이름만 적는다. agent_runner.py 가 `claude -p` 로 호출한다
model: "claude-opus-5-5"                   # 에이전트 모델 id. agent_runner.py 가 claude -p --model 로 넘긴다. 비우면 CLI 기본 모델을 쓴다(--model 옵션을 붙이지 않는다)
max_turns:                                 # 에이전트별 최대 턴 수(claude -p --max-turns). 넘으면 agent_runner.py 가 호출을 끊고 7.3 의 스키마 불일치와 같이 1회 재실행 후 보류한다 [가정: 사양서 7.3 은 턴 수·시간 초과의 처리를 정하지 않는다]
  researcher: 60
  verifier: 40
  storyteller: 8
agent_timeout_sec: 1800                    # 에이전트 1회 호출의 시간 상한(초). 넘으면 강제 종료하고 max_turns 초과와 같이 처리한다(1회 재실행 후 보류) [가정: 위와 같음]
allowed_tools:                             # 에이전트별 허용 도구(claude -p --allowedTools). 리서치·검증은 WebSearch·WebFetch 만, 스토리텔러는 도구 없이 실행한다(빈 목록). 파일 읽기·쓰기 도구는 어느 에이전트에도 주지 않는다
  researcher: [WebSearch, WebFetch]
  verifier: [WebSearch, WebFetch]
  storyteller: []
site_build_cmd: "mkdocs build --strict"    # 퍼블리셔 6단계 사이트 빌드 명령. 위키 루트에서 실행한다. 실패하면 커밋을 되돌리고 로그에 남긴다(6.4)
git_commit: true                           # 퍼블리셔 7단계 커밋 여부. 메시지 형식: run(DATE): <실행 유형> <대상 영역 이름> — 생성 n/갱신 n
git_push: false                            # 커밋 후 원격 푸시 여부. 기본은 푸시하지 않는다
timezone: "Asia/Seoul"                     # run_time·run_id(<DATE>-<NN>)·created/updated/accessed 날짜 계산에 쓰는 시간대
web_fetch_mirror_probe_url: "https://raw.githubusercontent.com/VDA5050/VDA5050/main/VDA5050_EN.md"   # 일반 페이지 열람이 막혔을 때 공식 저장소 원문(raw.githubusercontent.com)이 열리는지 에이전트 WebFetch 로 확인하는 URL(운영 전환 1-1, DECISIONS D-002). 열리면 fetch_mode: mirror_only
area_body_char_limit: 4000                 # 세부영역 페이지 3~11절 본문 기준 글자 수(5.4). 넘치면 validate_run.py 가 넘치는 절을 주제 페이지로 자동 분리한다(운영 전환 1-3)
web_fetch_probe_url: "https://ref.gs1.org/epcis/"   # 준비 단계(7.2의 1)의 페이지 열람 점검용 URL(참고문헌 ref-003 GS1 EPCIS). claude -p --tools WebFetch 로 한 번 연다. 열리지 않으면 web_tools_required 대로 중단한다(override 가 있으면 원문 미열람 모드로 진행)
web_fetch_required: true                   # 페이지 열람(WebFetch) 점검이 실패했을 때 즉시 중단·로그할지. true(기본값): 0장 web_tools_required 와 7.3 "웹 도구 없음 → 즉시 중단·로그" 원문대로 중단한다(실행마다 --allow-no-fetch 또는 ROP_ALLOW_NO_FETCH=1 로 예외 허용). false: 설정으로 계속 허용하는 사용자 override — 중단하지 않고 원문 미열람 모드(web_fetch_available: false)로 진행하며 로그에 "페이지 열람 불가 — 원문 미열람 모드(사용자 override)"를 남긴다. 네트워크 정책으로 열람이 막힌 환경에서만 쓴다 [가정: override 수단 — 사양서는 예외를 정하지 않는다]
runs_dir: "runs"                           # 실행 산출물 폴더(위키 루트 기준). runs/<DATE>-<NN>/ 와 보류 산출물 runs/parked/
data_dir: "data"                           # 퍼블리셔가 페이지를 다시 쓸 때 원천으로 삼는 상태 데이터 폴더(위키 루트 기준). open_questions.json, changelog.json, flow_matrix.json, tracks/<slug>/backlog.json
