# config/ops.yaml — 운영 설정: 알림 발송, 사이트 원격 배포, 운영 서버 cron 등록
#
# 외부에 영향을 주는 스위치(notify.enabled, deploy.enabled, cron.enabled)는 기본값이 모두 false 다.
# 켜고 끄는 한 줄 명령(주석을 보존하며 이 파일의 enabled 줄만 바꾼다):
#   python3 pipeline/lib/notify.py --enable notify --channel slack_webhook   # 또는 email / both
#   python3 pipeline/lib/notify.py --enable deploy
#   python3 pipeline/lib/notify.py --enable cron && bash pipeline/install_cron.sh
#   python3 pipeline/lib/notify.py --disable <notify|deploy|cron>            # cron 은 이어서 bash pipeline/uninstall_cron.sh
#   python3 pipeline/lib/notify.py --status                                 # 현재 스위치·비밀값 환경변수 설정 여부·crontab 등록 여부
#
# 비밀값(슬랙 웹훅 URL, SMTP 계정·비밀번호, Claude 인증 토큰)은 이 파일에 적지 않는다. 여기에는 "환경변수 이름"만 적고,
# 값은 환경변수로 준다. cron 실행에서는 pipeline/cron_wrapper.sh 가 cron.env_file(기본 ~/.config/rop-wiki/env, 권한 600)을
# 있으면 읽는다(형식·예시는 deploy/README.md 5절).
# 이 파일은 pipeline/lib/notify.py(load_ops)가 읽는다. 셸 스크립트는 `python3 pipeline/lib/notify.py --get <키>` 로 읽는다.
# 상대 경로는 위키 루트(rop-wiki/) 기준이다. 시험용으로 다른 파일을 쓰려면 환경변수 ROP_OPS_CONFIG=<경로> 를 준다.

# ---------------------------------------------------------------------------------------------
# 1. 알림 — 퍼블리셔 9단계(pipeline/publish.py step9_notify)가 실행 결과를 보낸다
# ---------------------------------------------------------------------------------------------
notify:
  enabled: false                 # false 면 발송 코드가 네트워크를 전혀 쓰지 않는다(status: disabled)
  channel: none                  # none / slack_webhook / email / both. settings.yaml 의 notify(사양서 0장 원문 값)보다 이 값이 우선한다
  on: [published, parked, failed]   # 어떤 결과에 보낼지: published(게시 완료) / parked(보류) / failed(중단·퍼블리셔 실패)
  site_url: "https://mjkim84.github.io/ai-hub/"   # 배포된 사이트 주소. 적으면 알림에 그날 일일 로그 페이지 링크를 붙이고, mkdocs.yml 의 site_url 로도 쓰인다(nav.py) [가정]
  slack:
    webhook_url_env: ROP_SLACK_WEBHOOK_URL   # 슬랙 수신 웹훅(Incoming Webhook) URL 을 담은 환경변수 이름. https:// 만 허용
    timeout_sec: 10
  email:
    smtp_host: ""                # 예 smtp.gmail.com
    smtp_port: 587
    use_tls: true                # true: 평문 연결 뒤 STARTTLS(포트 587). use_ssl 이 true 면 무시
    use_ssl: false               # true: 처음부터 TLS(SMTP_SSL, 포트 465)
    from: ""                     # 보내는 주소
    to: []                       # 받는 주소 목록
    username_env: ROP_SMTP_USERNAME   # SMTP 로그인 계정을 담은 환경변수 이름(둘 다 비어 있으면 로그인 없이 보낸다)
    password_env: ROP_SMTP_PASSWORD   # SMTP 비밀번호(앱 비밀번호)를 담은 환경변수 이름
    timeout_sec: 20

# ---------------------------------------------------------------------------------------------
# 2. 사이트 원격 배포 — 두 방식 중 하나만 쓴다(deploy/README.md)
# ---------------------------------------------------------------------------------------------
deploy:
  enabled: true                  # 2026-09-25 라이브 배포부터 true. false 면 pipeline/deploy_site.sh 는 로컬 빌드만 하고,
                                 # 템플릿 워크플로(rop-wiki/deploy/github-pages.yml)도 배포 단계를 건너뛴다
  method: actions                # gh-deploy: 이 서버가 `mkdocs gh-deploy` 로 gh-pages 브랜치를 푸시(pipeline/deploy_site.sh --yes)
                                 # actions:   GitHub Actions 가 빌드·배포(지금 이 저장소는 .github/workflows/rop-wiki-pages.yml 로 이미 켜져 있다)
  remote_name: origin            # gh-deploy 가 푸시할 git 원격
  remote_branch: gh-pages        # gh-deploy 가 푸시할 브랜치(저장소 Settings → Pages → Deploy from a branch 에서 이 브랜치를 고른다)
  after_daily_run: true          # enabled·gh-deploy 일 때 cron 래퍼가 정규 실행 성공(exit 0) 뒤 deploy_site.sh --yes 를 부른다

# ---------------------------------------------------------------------------------------------
# 3. 운영 서버 cron — pipeline/install_cron.sh 가 읽는다(uninstall_cron.sh 는 이 값과 관계없이 해제한다)
# ---------------------------------------------------------------------------------------------
cron:
  enabled: false                 # false 면 install_cron.sh 가 등록을 거부한다(--dry-run 은 언제나 가능, --force 로 한 번 무시)
  tz_mode: auto                  # auto: cron 데몬이 CRON_TZ 를 지원하면 crontz, 아니면 server
                                 # crontz: CRON_TZ=<시간대> 줄 + settings.run_time 시각(cronie: RHEL·Fedora·Arch 등)
                                 # server: run_time 을 서버 시간대 시각으로 환산해 등록(Debian·Ubuntu 기본 cron 은 CRON_TZ 를 무시한다)
  lock_file: runs/.lock          # flock -n 잠금 파일. 앞 실행이 끝나지 않았으면 이번 실행은 건너뛰고 cron.log 에 남긴다
  log_file: runs/cron.log        # cron 실행의 표준 출력·오류(실행별 상세 로그는 runs/<run_id>/log.md)
  log_max_bytes: 5242880         # cron.log 가 이 크기(5MB)를 넘으면 실행 시작 전에 cron.log.1 로 돌린다(이전 .1 은 지운다)
  env_file: ~/.config/rop-wiki/env   # 있으면 실행 전에 읽는 환경 파일(비밀값). 권한이 600 이 아니면 경고를 남긴다
  max_runtime_sec: 14400         # 한 번의 실행 시간 상한(4시간). 넘으면 timeout 으로 끝내고(잠금이 영구히 잡히지 않게) 종료 코드 124 를 남긴다. 0 이면 상한 없음

# ---------------------------------------------------------------------------------------------
# 4. 공개 사이트(GitHub Pages) 배포 시 노출 범위 — pipeline/lib/nav.py(write_mkdocs_yml)가 매 실행마다 읽어
#    mkdocs.yml 에 반영한다(손으로 mkdocs.yml 을 고쳐도 다음 실행에서 되돌아온다). 자세한 절차는 README.md "배포" 절.
# ---------------------------------------------------------------------------------------------
publish:
  logs_public: false             # false 면 docs/logs/ 와 docs/metrics.md 를 mkdocs exclude_docs·내비게이션에서 뺀다(로그 비공개). true 로 되돌리면 다시 공개된다
  show_verification_banner: true    # true 면 mkdocs.yml 에 extra.verification_banner: true 와 theme.custom_dir: overrides 를 켠다(안내 배너 표시). false 로 끌 수 있다
